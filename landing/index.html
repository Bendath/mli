<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mli — Emelie Blomgren | Nordisk Klang</title>
  <meta name="description" content="Mli (Emelie Blomgren) — En rejse gennem den nordiske folkesjæl.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.4);
    }
    
    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .ui-overlay {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      pointer-events: none;
      text-align: center;
      background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
    }

    .ui-overlay > * {
      pointer-events: auto;
    }

    .hero-content {
      max-width: 700px;
      margin-top: 5rem;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 0.4em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 2.5rem;
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 2rem;
      font-family: 'Cinzel', serif;
    }

    .description {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 3rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .btn-tiktok {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 2.8rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 100px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 10px rgba(255,255,255,0.05);
    }

    .btn-tiktok:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold-primary);
      box-shadow: 0 0 50px var(--gold-glow);
      transform: translateY(-5px) scale(1.05);
      letter-spacing: 0.15em;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0c;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-out;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 2px solid rgba(212, 175, 55, 0.1);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 2rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .tiktok-svg { width: 24px; height: 24px; }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loader"></div>
    <p style="font-family: 'Cinzel', serif; letter-spacing: 0.2em; color: var(--gold-primary);">Stemmer instrumenterne...</p>
  </div>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="hero-content">
      <h2>Nordisk Klang & Svensk Folkemusik</h2>
      <h1 class="tagline">En rejse gennem den nordiske folkesjæl</h1>
      <p class="description">
        Træd ind i et univers af glemte viser, lyriske hymner og den rå skønhed i nordisk folkemusik. Oplev Mli's personlige fortolkninger af vores fælles musikalske arv.
      </p>
      
      <a href="https://www.tiktok.com/@mli_ananas?lang=da" target="_blank" class="btn-tiktok">
        <svg class="tiktok-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.4a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.3a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.98a8.18 8.18 0 0 0 4.76 1.52V7.05a4.84 4.84 0 0 1-1-.36z"/></svg>
        <span>Oplev Mli på TikTok</span>
      </a>
    </div>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { if (loader.parentNode) loader.remove(); }, 1000);
      }
    }
    window.addEventListener('load', () => setTimeout(hideLoader, 4000));
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0c, 0.05);
    
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const fontLoader = new FontLoader();

    // --- DEPTH PARALLAX SHADER ---
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform sampler2D uDepth;
      uniform vec2 uMouse;
      varying vec2 vUv;
      void main() {
        float depth = texture2D(uDepth, vUv).r;
        // The mouse displacement is multiplied by depth (0 to 1)
        // This makes far objects (dark in depth map) move less, near objects (light) move more
        vec2 displacement = uMouse * depth * 0.05;
        gl_FragColor = texture2D(uTexture, vUv + displacement);
      }
    `;

    const backgroundTexture = textureLoader.load('images/hero_premium.png');
    const depthMap = textureLoader.load('images/Lotus_depth_00001_.png');
    
    const shaderMat = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: backgroundTexture },
        uDepth: { value: depthMap },
        uMouse: { value: new THREE.Vector2(0, 0) }
      },
      vertexShader,
      fragmentShader
    });

    const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(35, 20), shaderMat);
    bgPlane.position.z = -10;
    scene.add(bgPlane);

    // --- BONFIRE GLOW ---
    const bonfireGroup = new THREE.Group();
    bonfireGroup.position.set(-7, -4.5, -9); // Position matched to the bonfire in the image
    scene.add(bonfireGroup);

    const bonfireLight = new THREE.PointLight(0xffaa44, 25, 15);
    bonfireGroup.add(bonfireLight);

    // Create a glow sprite
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 180, 100, 1)');
    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    const glowTexture = new THREE.CanvasTexture(canvas);
    
    const glowMat = new THREE.SpriteMaterial({ 
      map: glowTexture, 
      color: 0xffaa44, 
      transparent: true, 
      blending: THREE.AdditiveBlending,
      opacity: 0.8
    });
    const bonfireGlow = new THREE.Sprite(glowMat);
    bonfireGlow.scale.set(4, 4, 1);
    bonfireGroup.add(bonfireGlow);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);
    const goldLight = new THREE.PointLight(0xd4af37, 30, 30);
    goldLight.position.set(5, 5, 5);
    scene.add(goldLight);

    // Mouse Light (Cinematic Beam)
    const mouseLight = new THREE.SpotLight(0xd4af37, 100);
    mouseLight.angle = Math.PI / 6; // Narrow cone
    mouseLight.penumbra = 0.5;      // Soft edges
    mouseLight.decay = 2;
    mouseLight.distance = 50;
    scene.add(mouseLight);
    scene.add(mouseLight.target);

    // --- DRIFTING MIST ---
    const mistGroup = new THREE.Group();
    scene.add(mistGroup);

    const mistCount = 15;
    const mistSprites = [];
    const mistMat = new THREE.SpriteMaterial({
      map: glowTexture, // Reuse the soft radial gradient
      color: 0xcccccc,
      transparent: true,
      opacity: 0.15,
      blending: THREE.NormalBlending
    });

    for (let i = 0; i < mistCount; i++) {
      const mist = new THREE.Sprite(mistMat);
      mist.position.set(
        Math.random() * 20 - 10,
        Math.random() * 4 - 5, // Lower to the ground
        Math.random() * 10 - 15
      );
      mist.scale.set(8 + Math.random() * 10, 5 + Math.random() * 5, 1);
      mistGroup.add(mist);
      mistSprites.push({
        mesh: mist,
        speed: 0.002 + Math.random() * 0.005,
        offset: Math.random() * Math.PI * 2
      });
    }

    // Magical Pollen (Suggestion 2)
    const pollenCount = 400;
    const pollenGeo = new THREE.BufferGeometry();
    const pollenPos = new Float32Array(pollenCount * 3);
    const pollenSpeeds = new Float32Array(pollenCount);
    const pollenOffsets = new Float32Array(pollenCount);
    
    for (let i = 0; i < pollenCount; i++) {
      pollenPos[i * 3] = (Math.random() - 0.5) * 25;
      pollenPos[i * 3 + 1] = Math.random() * 15 - 7.5;
      pollenPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
      pollenSpeeds[i] = 0.01 + Math.random() * 0.02;
      pollenOffsets[i] = Math.random() * Math.PI * 2;
    }
    pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
    const pollenMat = new THREE.PointsMaterial({
      color: 0xd4af37,
      size: 0.06,
      transparent: true,
      blending: THREE.AdditiveBlending,
      opacity: 0.5
    });
    const pollenSystem = new THREE.Points(pollenGeo, pollenMat);
    scene.add(pollenSystem);

    let logo;
    fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      const geo = new TextGeometry('Mli', {
        font: font, size: 1.5, height: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03
      });
      geo.center();
      const mat = new THREE.MeshStandardMaterial({ 
        color: 0xd4af37, metalness: 0.8, roughness: 0.2, emissive: 0xd4af37, emissiveIntensity: 0.5
      });
      logo = new THREE.Mesh(geo, mat);
      logo.position.y = 2.5;
      scene.add(logo);
      hideLoader();
    }, undefined, hideLoader);

    camera.position.z = 12;

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
      mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
      
      // Update shader uniforms
      shaderMat.uniforms.uMouse.value.set(mouseX, -mouseY);
    });

    function animate() {
      requestAnimationFrame(animate);
      if (logo) {
        logo.rotation.y += (mouseX * 0.4 - logo.rotation.y) * 0.05;
        logo.rotation.x += (mouseY * 0.2 - logo.rotation.x) * 0.05;
      }
      camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.02;
      camera.lookAt(0, 1.5, 0);

      const positions = pollenSystem.geometry.attributes.position.array;
      for (let i = 0; i < pollenCount; i++) {
        positions[i * 3 + 1] += pollenSpeeds[i];
        positions[i * 3] += Math.sin(Date.now() * 0.001 + pollenOffsets[i]) * 0.005;
        if (positions[i * 3 + 1] > 8) {
          positions[i * 3 + 1] = -7.5;
          positions[i * 3] = (Math.random() - 0.5) * 25;
        }
      }
      pollenSystem.geometry.attributes.position.needsUpdate = true;
      
      // Animate Mist
      mistSprites.forEach(m => {
        m.mesh.position.x += m.speed;
        m.mesh.position.y += Math.sin(Date.now() * 0.001 + m.offset) * 0.001;
        if (m.mesh.position.x > 15) m.mesh.position.x = -15;
      });

      // Update mouse light position and target
      mouseLight.position.set(mouseX * 12, -mouseY * 12, 10);
      mouseLight.target.position.set(mouseX * 8, -mouseY * 8, -10);

      // Animate Bonfire Flicker
      const flicker = Math.sin(Date.now() * 0.008) * 0.2 + 0.8;
      bonfireLight.intensity = (20 + Math.random() * 10) * flicker;
      bonfireGlow.scale.set(4 * flicker, 4 * flicker, 1);
      bonfireGlow.material.opacity = 0.6 + Math.random() * 0.4;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
