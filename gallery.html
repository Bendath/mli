<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLI — Billedgalleri & ComfyUI Prompt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --bg-dark: #0f0e13;
      --bg-card: #181620;
      --bg-card-hover: #221f2d;
      --border: rgba(212, 175, 55, 0.2);
      --text: #eae8e3;
      --text-muted: #9e9a90;
      --accent-blue: #4a90e2;
      --accent-green: #40c070;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: rgba(15, 14, 19, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .brand .badge {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Navigation / Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.3rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--gold);
      color: #000;
      font-weight: 600;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Grid Layout */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--gold-glow);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #08070a;
      overflow: hidden;
      cursor: pointer;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img-wrapper img {
      transform: scale(1.05);
    }

    .card-tag {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: var(--gold-light);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Modal Studio */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 1200px;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      padding: 2rem;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 900px) {
      .modal-content {
        grid-template-columns: 1fr;
      }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 0, 0, 0.4);
    }

    .modal-preview {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-preview img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 10px;
      background: #050507;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-controls {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .modal-controls h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 1.3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
    }

    select, textarea, input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .prompt-box {
      background: rgba(212, 175, 55, 0.05);
      border: 1px dashed var(--border);
      padding: 1rem;
      border-radius: 8px;
      position: relative;
    }

    .copy-status {
      font-size: 0.8rem;
      color: var(--accent-green);
      display: none;
      margin-left: 0.5rem;
    }

    /* Side-by-side comparison view */
    .compare-container {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .compare-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .compare-box h4 {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .compare-box img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <h1>MLI</h1>
      <span class="badge">ComfyUI Flux.2 Klein Studio</span>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCategory('all')">Alle Billeder</button>
      <button class="tab-btn" onclick="filterCategory('webp')">✨ Belyste WebP (Nye)</button>
      <button class="tab-btn" onclick="filterCategory('24-08')">24-08 Serie</button>
      <button class="tab-btn" onclick="filterCategory('16-08')">16-08 Serie</button>
      <button class="tab-btn" onclick="filterCategory('19-08')">19-08 Serie</button>
      <button class="tab-btn" onclick="filterCategory('andre')">Andre Assets</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="gallery-grid" id="galleryGrid">
      <!-- Dynamic rendering via JavaScript -->
    </div>
  </main>

  <!-- ComfyUI Prompt & Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>

      <!-- Left: Image Preview -->
      <div class="modal-preview">
        <img id="modalImg" src="" alt="Valgt Billede">
        <div style="font-size:0.85rem; color:var(--text-muted); display:flex; justify-content:space-between;">
          <span id="modalFilename">billede.jpg</span>
          <span id="modalCategory" style="color:var(--gold-light)">Kategori</span>
        </div>
      </div>

      <!-- Right: ComfyUI Flux.2 Klein Controls & Relighting -->
      <div class="modal-controls">
        <!-- Studio Mode Switcher -->
        <div class="tabs" style="margin-bottom: 0.5rem;">
          <button class="tab-btn active" id="modeRelightBtn" onclick="switchStudioMode('relight')">💡 Lys & Belysning (Anbefalet)</button>
          <button class="tab-btn" id="modePromptBtn" onclick="switchStudioMode('prompt')">🤖 ComfyUI AI Prompt</button>
        </div>

        <!-- RELIGHTING CONTROLS -->
        <div id="relightPanel" style="display:flex; flex-direction:column; gap:1rem;">
          <h2>Professionel Belysning & Farvekorrektion</h2>
          
          <div class="field-group">
            <label for="lightPreset">Vælg Lys-Stemning Preset:</label>
            <select id="lightPreset" onchange="applyLightPreset()">
              <option value="golden_hour">Golden Hour (Varmt Sollys & Blød Glød)</option>
              <option value="studio_dramatic">Dramatisk Studiolys & Høj Kontrast</option>
              <option value="soft_portrait">Blødt Portrætlys (Skånsom Hud & Dæmpet Baggrund)</option>
              <option value="nordic_mood">Mørk Nordisk Stemning (Koldere Skygger, Varmt Ansigt)</option>
              <option value="natural">Original Nulstilling</option>
            </select>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
            <div class="field-group">
              <label>Eksponering / Lysstyrke: <span id="valBrightness">100%</span></label>
              <input type="range" id="sliderBrightness" min="60" max="150" value="100" oninput="updateRelight()">
            </div>
            <div class="field-group">
              <label>Kontrast & Dybde: <span id="valContrast">105%</span></label>
              <input type="range" id="sliderContrast" min="70" max="160" value="105" oninput="updateRelight()">
            </div>
            <div class="field-group">
              <label>Farvevarme (Temperatur): <span id="valWarmth">110%</span></label>
              <input type="range" id="sliderWarmth" min="70" max="150" value="110" oninput="updateRelight()">
            </div>
            <div class="field-group">
              <label>Mætning (Glød): <span id="valSaturate">105%</span></label>
              <input type="range" id="sliderSaturate" min="60" max="150" value="105" oninput="updateRelight()">
            </div>
            <div class="field-group">
              <label>Vignette (Kantmørkning): <span id="valVignette">40%</span></label>
              <input type="range" id="sliderVignette" min="0" max="100" value="40" oninput="updateRelight()">
            </div>
            <div class="field-group">
              <label>Baggrundssløring (Bokeh): <span id="valBlur">0px</span></label>
              <input type="range" id="sliderBlur" min="0" max="10" value="0" oninput="updateRelight()">
            </div>
          </div>

          <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
            <button class="btn" onclick="downloadRelitImage()">💾 Download Belyst Billede</button>
            <button class="btn btn-secondary" onclick="applyLightPreset('natural')">↺ Nulstil Lys</button>
          </div>
        </div>

        <!-- AI PROMPT PANEL (Hidden by default) -->
        <div id="promptPanel" style="display:none; flex-direction:column; gap:1rem;">
          <h2>Flux.2 Klein 4B Prompt Generator</h2>
          
          <div class="field-group">
            <label for="presetSelect">Vælg Baggrunds-Preset til ComfyUI:</label>
            <select id="presetSelect" onchange="applyPreset()">
              <option value="warm_interior">Varmt Hyggeligt Interiør (Standard til stue/væg)</option>
              <option value="nordic_forest">Nordisk Nåleskov v. Skumring (Golden Hour)</option>
              <option value="concert_stage">Dæmpet Koncertscene med Varm Spotlight</option>
              <option value="viking_hall">Historisk Træsal / Skjaldemiljø</option>
              <option value="studio_dark">Mørkt Cinematisk Studie med Softbox Lys</option>
              <option value="custom">Tilpasset Prompt (Skriv selv)</option>
            </select>
          </div>

          <div class="field-group">
            <label for="promptText">Genereret ComfyUI Prompt (Flux.2 Klein 4B):</label>
            <textarea id="promptText" placeholder="Skriv din prompt her..."></textarea>
          </div>

          <div style="display:flex; gap:0.75rem; align-items:center;">
            <button class="btn" style="padding:0.75rem 1.25rem; font-size:0.95rem;" onclick="copyPrompt()">
              📋 Kopier Prompt til ComfyUI
            </button>
            <span class="copy-status" id="copyStatus">Kopieret til udklipsholder!</span>
          </div>

          <div class="field-group" style="margin-top:0.5rem;">
            <label for="outputLoader">Prøvevisning: Upload/Vælg genereret ComfyUI billede:</label>
            <input type="file" id="outputLoader" accept="image/*" onchange="loadOutputPreview(event)">
          </div>
        </div>
      </div>

      <!-- Comparison Section -->
      <div class="compare-container">
        <div class="compare-box">
          <h4>Originalt Foto</h4>
          <img id="compareOriginal" src="" alt="Original">
        </div>
        <div class="compare-box">
          <h4>Med Professionel Belysning & Farvegraduering</h4>
          <canvas id="relightCanvas" style="width:100%; height:250px; object-fit:contain; background:#000; border-radius:8px; border:1px solid rgba(255,255,255,0.1);"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // List of images cataloged in project
    const images = [
      // Belyste & Optimerede WebP
      { name: "georginer_album.webp", cat: "webp", title: "MLI Rød Rosenguitar & Hvid Georgine", size: "320 KB" },
      { name: "mli_glasses_portrait.webp", cat: "webp", title: "Portræt m. Briller (Varm Belysning)", size: "776 KB" },
      { name: "mli_chair_guitar.webp", cat: "webp", title: "MLI m. Guitar (Guld Tone & Kontrast)", size: "408 KB" },
      { name: "mli_portrait_wall.webp", cat: "webp", title: "MLI Væg Portræt (Soft Studiolys)", size: "589 KB" },
      { name: "mli_stone_wall.webp", cat: "webp", title: "MLI Natur Stensætning (Dybde)", size: "579 KB" },
      { name: "mli_hero_headphones.webp", cat: "webp", title: "Hero Portræt (Optimeret)", size: "196 KB" },
      { name: "mli_stage_mic.webp", cat: "webp", title: "Scene Mikrofon (Optimeret)", size: "186 KB" },

      // 24-08 Series
      { name: "IMG20260824120421.jpg", cat: "24-08", title: "MLI m. Guitar & Rød Lænestol", size: "3.8 MB" },
      { name: "IMG20260824091923.jpg", cat: "24-08", title: "MLI Portræt v. Væg", size: "5.0 MB" },
      
      // 16-08 Series
      { name: "IMG20260816115014.jpg", cat: "16-08", title: "MLI på Stensætning i Natur", size: "10.9 MB" },
      { name: "IMG20260816115251.jpg", cat: "16-08", title: "Nærbillede m. Briller (Smil)", size: "10.0 MB" },
      { name: "IMG20260816115359.jpg", cat: "16-08", title: "Portræt m. Tørklæde & Stjerner", size: "11.0 MB" },
      { name: "IMG20260816115406.jpg", cat: "16-08", title: "Nærbillede m. Briller & Busk", size: "11.3 MB" },
      { name: "IMG20260816115409.jpg", cat: "16-08", title: "Portræt m. Tørklæde (Varmt)", size: "11.3 MB" },
      { name: "IMG20260816114858.jpg", cat: "16-08", title: "Natur Helfigur Pose 1", size: "9.9 MB" },
      { name: "IMG20260816115008.jpg", cat: "16-08", title: "Natur Pose v. Træer", size: "10.2 MB" },

      // 19-08 Series
      { name: "IMG20260819105351.jpg", cat: "19-08", title: "Scene Portræt m. Mikrofon", size: "7.5 MB" },
      { name: "IMG20260819105401.jpg", cat: "19-08", title: "Studio Vokalsession", size: "8.1 MB" },
      { name: "IMG20260819105412.jpg", cat: "19-08", title: "Hero Portræt m. Hovedtelefoner", size: "7.8 MB" },

      // Andre Assets
      { name: "mli-nature-guitar.jpg", cat: "andre", title: "MLI m. Guitar i Sollys", size: "87 KB" },
      { name: "mli-lute.jpg", cat: "andre", title: "MLI Spiller Lyre i Skoven", size: "62 KB" },
      { name: "isolated_guitar.png", cat: "andre", title: "Isoleret Guitar cutout", size: "530 KB" },
      { name: "Billede 04.03.2026, 14.09.30.jpg", cat: "andre", title: "Ekstra Portræt 2026", size: "2.1 MB" }
    ];

    const presets = {
      warm_interior: "Change the background to a cozy, softly lit interior space with warm beige tones, soft natural window light filtering through, and a relaxed, intimate atmosphere similar to the original image's mood. Keep the person in the exact same position, scale, and pose. Maintain identical camera angle, framing, and perspective. The lighting should be soft, even, and warm - not harsh or bright. Only replace the room environment, preserving all facial features, hairstyle, expression, clothing, and pose exactly as they are.",
      nordic_forest: "Change the background to a breathtaking Nordic pine forest during dusk golden hour with subtle mist between the pine trees and soft warm sunlight piercing through. Keep the person in the exact same position, scale, pose, and framing. Blend the natural lighting realistically onto the subject's hair and clothing. Preserve all facial features, glasses, expression, and garments exactly as they are.",
      concert_stage: "Change the background to an intimate, atmospheric acoustic concert stage with subtle warm golden spotlights, blurred background bokeh lights, and moody dark tones. Keep the person in the exact same position, scale, pose, and framing. Preserve all facial details and attire perfectly.",
      viking_hall: "Change the background to an authentic historic Nordic wood hall with warm timber beams, ambient lantern glow, and subtle historic craftsmanship details. Preserve the person's exact pose, features, clothing, and expression without distortion.",
      studio_dark: "Change the background to a dark, cinematic studio backdrop with soft golden rim lighting accentuating the contours. Maintain exact pose, scale, and facial realism."
    };

    const lightPresets = {
      golden_hour: { brightness: 108, contrast: 110, warmth: 125, saturate: 115, vignette: 45, blur: 0 },
      studio_dramatic: { brightness: 95, contrast: 135, warmth: 105, saturate: 100, vignette: 65, blur: 0 },
      soft_portrait: { brightness: 105, contrast: 98, warmth: 110, saturate: 105, vignette: 25, blur: 0 },
      nordic_mood: { brightness: 92, contrast: 120, warmth: 95, saturate: 90, vignette: 55, blur: 0 },
      natural: { brightness: 100, contrast: 100, warmth: 100, saturate: 100, vignette: 0, blur: 0 }
    };

    let activeImage = null;
    let baseImgEl = new Image();

    function renderGallery(catFilter = 'all') {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      const filtered = catFilter === 'all' 
        ? images 
        : images.filter(img => img.cat === catFilter);

      filtered.forEach(img => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrapper" onclick="openStudio('${img.name}')">
            <img src="${img.name}" alt="${img.title}" loading="lazy">
            <span class="card-tag">${img.cat}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${img.title}</div>
            <div class="card-meta">
              <span>${img.name}</span>
              <span>${img.size}</span>
            </div>
            <div class="card-actions">
              <button class="btn" onclick="openStudio('${img.name}')">💡 Belysnings Studio</button>
              <a href="${img.name}" target="_blank" class="btn btn-secondary" style="text-decoration:none;">🔍 Se Fuld</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGallery(cat);
    }

    function openStudio(imgName) {
      const imgObj = images.find(i => i.name === imgName);
      if(!imgObj) return;

      activeImage = imgObj;
      document.getElementById('modalImg').src = imgObj.name;
      document.getElementById('compareOriginal').src = imgObj.name;
      document.getElementById('modalFilename').textContent = imgObj.name + ' (' + imgObj.size + ')';
      document.getElementById('modalCategory').textContent = 'Kategori: ' + imgObj.cat;

      baseImgEl = new Image();
      baseImgEl.onload = function() {
        applyLightPreset('golden_hour');
      };
      baseImgEl.src = imgObj.name;

      // Reset preset
      document.getElementById('presetSelect').value = 'warm_interior';
      applyPreset();

      document.getElementById('editModal').classList.add('open');
    }

    function switchStudioMode(mode) {
      if(mode === 'relight') {
        document.getElementById('relightPanel').style.display = 'flex';
        document.getElementById('promptPanel').style.display = 'none';
        document.getElementById('modeRelightBtn').classList.add('active');
        document.getElementById('modePromptBtn').classList.remove('active');
      } else {
        document.getElementById('relightPanel').style.display = 'none';
        document.getElementById('promptPanel').style.display = 'flex';
        document.getElementById('modePromptBtn').classList.add('active');
        document.getElementById('modeRelightBtn').classList.remove('active');
      }
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('open');
    }

    function applyLightPreset(name) {
      const pName = name || document.getElementById('lightPreset').value;
      const p = lightPresets[pName] || lightPresets.golden_hour;

      document.getElementById('sliderBrightness').value = p.brightness;
      document.getElementById('sliderContrast').value = p.contrast;
      document.getElementById('sliderWarmth').value = p.warmth;
      document.getElementById('sliderSaturate').value = p.saturate;
      document.getElementById('sliderVignette').value = p.vignette;
      document.getElementById('sliderBlur').value = p.blur;

      updateRelight();
    }

    function updateRelight() {
      const br = document.getElementById('sliderBrightness').value;
      const ct = document.getElementById('sliderContrast').value;
      const warm = document.getElementById('sliderWarmth').value;
      const sat = document.getElementById('sliderSaturate').value;
      const vig = document.getElementById('sliderVignette').value;
      const blur = document.getElementById('sliderBlur').value;

      document.getElementById('valBrightness').textContent = br + '%';
      document.getElementById('valContrast').textContent = ct + '%';
      document.getElementById('valWarmth').textContent = warm + '%';
      document.getElementById('valSaturate').textContent = sat + '%';
      document.getElementById('valVignette').textContent = vig + '%';
      document.getElementById('valBlur').textContent = blur + 'px';

      const canvas = document.getElementById('relightCanvas');
      if (!baseImgEl.complete || baseImgEl.width === 0) return;

      canvas.width = baseImgEl.naturalWidth || 800;
      canvas.height = baseImgEl.naturalHeight || 600;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply CSS Filters to Canvas Context
      const sepiaVal = Math.max(0, (warm - 100) * 0.8);
      const filterStr = `brightness(${br}%) contrast(${ct}%) saturate(${sat}%) sepia(${sepiaVal}%)`;
      ctx.filter = filterStr;

      ctx.drawImage(baseImgEl, 0, 0, canvas.width, canvas.height);
      ctx.filter = 'none';

      // Apply Warm Golden Light Overlay
      if (warm > 100) {
        const warmOpacity = (warm - 100) / 200;
        ctx.fillStyle = `rgba(255, 180, 70, ${warmOpacity})`;
        ctx.mixBlendMode = 'overlay';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Apply Vignette
      if (vig > 0) {
        const radGrad = ctx.createRadialGradient(
          canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.3,
          canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75
        );
        radGrad.addColorStop(0, 'rgba(0,0,0,0)');
        radGrad.addColorStop(1, `rgba(0,0,0,${vig / 100})`);
        ctx.fillStyle = radGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function downloadRelitImage() {
      const canvas = document.getElementById('relightCanvas');
      const link = document.createElement('a');
      link.download = `relit_${activeImage ? activeImage.name : 'image.jpg'}`;
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
    }

    function applyPreset() {
      const val = document.getElementById('presetSelect').value;
      const textarea = document.getElementById('promptText');
      if (presets[val]) {
        textarea.value = presets[val];
      }
    }

    function copyPrompt() {
      const textarea = document.getElementById('promptText');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      
      const status = document.getElementById('copyStatus');
      status.style.display = 'inline';
      setTimeout(() => { status.style.display = 'none'; }, 3000);
    }

    function loadOutputPreview(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('compareOutput').src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // Initial render
    renderGallery('all');
  </script>
</body>
</html>
