<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Admin — MLI</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            margin-top: calc(var(--nav-height) + 2rem);
            padding: 0 2rem 4rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-header h1 {
            font-size: 1.8rem;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(184, 147, 78, 0.15);
            color: var(--color-gold);
            border-radius: 99px;
            border: 1px solid rgba(184, 147, 78, 0.3);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: 1.2rem;
            border: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .stat-card .stat-number {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .stat-pending .stat-number {
            color: #C98B1D;
        }

        .stat-approved .stat-number {
            color: var(--color-accent);
        }

        .stat-declined .stat-number {
            color: #B54A4A;
        }

        .stat-total .stat-number {
            color: var(--color-heading);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            border: 1px solid var(--color-border);
            background: transparent;
            border-radius: 99px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            color: var(--color-text-muted);
        }

        .filter-tab:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .filter-tab.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: white;
        }

        .calendar-section {
            margin-bottom: 2.5rem;
        }

        .calendar-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            border: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-sm);
        }

        .calendar-header-cell {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-muted);
            padding: 0.5rem 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            position: relative;
            cursor: default;
            transition: all var(--transition);
            min-height: 44px;
        }

        .calendar-day.empty {
            background: transparent;
        }

        .calendar-day.today {
            font-weight: 700;
            box-shadow: inset 0 0 0 2px var(--color-accent);
        }

        .calendar-day.has-pending {
            background: rgba(201, 139, 29, 0.12);
        }

        .calendar-day.has-approved {
            background: rgba(91, 122, 94, 0.15);
        }

        .calendar-day.has-declined {
            background: rgba(181, 74, 74, 0.1);
        }

        .calendar-day .day-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 2px;
        }

        .dot-pending {
            background: #C98B1D;
        }

        .dot-approved {
            background: var(--color-accent);
        }

        .dot-declined {
            background: #B54A4A;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }

        .calendar-nav h3 {
            font-size: 1.1rem;
            min-width: 180px;
        }

        .cal-nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 1rem;
            color: var(--color-text-muted);
        }

        .cal-nav-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .booking-entry {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-sm);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1.2rem;
            align-items: center;
            transition: all var(--transition);
        }

        .booking-entry:hover {
            box-shadow: var(--shadow-md);
        }

        .booking-date-col {
            text-align: center;
            min-width: 60px;
        }

        .booking-date-col .date-day {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1;
            color: var(--color-heading);
        }

        .booking-date-col .date-month {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-muted);
            font-weight: 600;
        }

        .booking-date-col .date-time {
            font-size: 0.72rem;
            color: var(--color-accent);
            font-weight: 500;
            margin-top: 0.2rem;
        }

        .booking-info h4 {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-heading);
            margin-bottom: 0.2rem;
        }

        .booking-info .booking-meta {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-bottom: 0.15rem;
        }

        .booking-info .booking-meta span {
            margin-right: 1rem;
        }

        .booking-info .booking-msg {
            font-size: 0.85rem;
            color: var(--color-text);
            margin-top: 0.4rem;
            font-style: italic;
            opacity: 0.8;
        }

        .booking-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border: 1px solid;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            background: transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .action-approve {
            color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .action-approve:hover {
            background: var(--color-accent);
            color: white;
        }

        .action-decline {
            color: #B54A4A;
            border-color: #B54A4A;
        }

        .action-decline:hover {
            background: #B54A4A;
            color: white;
        }

        .action-delete {
            color: var(--color-text-muted);
            border-color: var(--color-border);
        }

        .action-delete:hover {
            background: var(--color-text-muted);
            color: white;
        }

        .action-calendar {
            color: #4285F4;
            border-color: #4285F4;
        }

        .action-calendar:hover {
            background: #4285F4;
            color: white;
        }

        .action-confirm {
            color: #1a8f5c;
            border-color: #1a8f5c;
        }

        .action-confirm:hover {
            background: #1a8f5c;
            color: white;
        }

        .callback-flag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-radius: 99px;
            background: rgba(220, 80, 40, 0.12);
            color: #DC5028;
            animation: pulse-flag 2s infinite;
        }

        @keyframes pulse-flag {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-radius: 99px;
        }

        .status-pending {
            background: rgba(201, 139, 29, 0.15);
            color: #C98B1D;
        }

        .status-approved {
            background: rgba(91, 122, 94, 0.15);
            color: var(--color-accent);
        }

        .status-declined {
            background: rgba(181, 74, 74, 0.1);
            color: #B54A4A;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--color-text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            opacity: 0.4;
        }

        .add-section {
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--color-border-light);
        }

        .add-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--color-border-light);
        }

        .add-form .form-group:last-of-type {
            grid-column: 1 / -1;
        }

        .add-form .btn {
            grid-column: 1 / -1;
        }

        @media (max-width: 700px) {
            .booking-entry {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            .booking-date-col {
                text-align: left;
                display: flex;
                gap: 0.5rem;
                align-items: baseline;
            }

            .add-form {
                grid-template-columns: 1fr;
            }

            .calendar-day {
                font-size: 0.75rem;
                min-height: 36px;
            }
        }

        /* Password Gate */
        .auth-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .auth-box h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .auth-box p {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 1.5rem;
        }

        .auth-box input {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.15em;
        }

        .auth-box input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .auth-error {
            color: #B54A4A;
            font-size: 0.8rem;
            margin-top: -0.5rem;
            margin-bottom: 0.8rem;
            display: none;
        }
    </style>
</head>

<body>

    <!-- Password Gate -->
    <div class="auth-gate" id="auth-gate">
        <div class="auth-box">
            <h2>🔒 Admin Login</h2>
            <p>Indtast adgangskode for at se bookinger</p>
            <input type="password" id="auth-password" placeholder="Adgangskode" autocomplete="off">
            <div class="auth-error" id="auth-error">Forkert adgangskode</div>
            <button class="btn btn-primary btn-full" id="auth-submit">Log ind</button>
        </div>
    </div>

    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">MLI</a>
            <span
                style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-gold);font-weight:600;">Booking
                Admin</span>
        </div>
    </nav>

    <main class="admin-page" style="display:none;" id="admin-content">
        <div class="admin-header">
            <div>
                <h1>Bookingkalender</h1>
                <p style="color:var(--color-text-muted);font-size:0.9rem;">Administrer forespørgsler, tider og
                    tilgængelighed</p>
            </div>
            <span class="admin-badge">🔒 Skjult side</span>
        </div>

        <div class="stats-row">
            <div class="stat-card stat-total">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">I alt</div>
            </div>
            <div class="stat-card stat-pending">
                <div class="stat-number" id="stat-pending">0</div>
                <div class="stat-label">Afventer</div>
            </div>
            <div class="stat-card stat-approved">
                <div class="stat-number" id="stat-approved">0</div>
                <div class="stat-label">Godkendt</div>
            </div>
            <div class="stat-card stat-declined">
                <div class="stat-number" id="stat-declined">0</div>
                <div class="stat-label">Afvist</div>
            </div>
        </div>

        <div class="calendar-section">
            <h2>Kalender</h2>
            <div class="calendar-nav">
                <button class="cal-nav-btn" id="cal-prev">‹</button>
                <h3 id="cal-month-label"></h3>
                <button class="cal-nav-btn" id="cal-next">›</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Alle</button>
            <button class="filter-tab" data-filter="pending">Afventer</button>
            <button class="filter-tab" data-filter="approved">Godkendt</button>
            <button class="filter-tab" data-filter="declined">Afvist</button>
        </div>

        <div class="booking-list" id="booking-list"></div>

        <div class="add-section">
            <h2>Tilføj manuelt</h2>
            <form class="add-form" id="add-form">
                <div class="form-group">
                    <label for="add-name">Navn</label>
                    <input type="text" id="add-name" placeholder="Kundens navn eller 'Optaget'">
                </div>
                <div class="form-group">
                    <label for="add-date">Dato *</label>
                    <input type="date" id="add-date" required>
                </div>
                <div class="form-group">
                    <label for="add-time-start">Fra kl.</label>
                    <input type="time" id="add-time-start" value="18:00">
                </div>
                <div class="form-group">
                    <label for="add-time-end">Til kl.</label>
                    <input type="time" id="add-time-end" value="21:00">
                </div>
                <div class="form-group">
                    <label for="add-event">Type</label>
                    <input type="text" id="add-event" placeholder="F.eks. Koncert, Privat, Blokeret">
                </div>
                <div class="form-group">
                    <label for="add-location">Sted</label>
                    <input type="text" id="add-location" placeholder="Adresse eller stedets navn">
                </div>
                <div class="form-group">
                    <label for="add-status">Status</label>
                    <select id="add-status">
                        <option value="pending">Afventer</option>
                        <option value="approved">Godkendt</option>
                        <option value="declined">Afvist</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="add-note">Note</label>
                    <textarea id="add-note" placeholder="Valgfri note..." rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Tilføj booking</button>
            </form>
        </div>
    </main>

    <script>
        (function () {
            // --- Password Gate ---
            // SHA-256 hash of the password "mli2026" (change this to change the password)
            const PASS_HASH = '61f2b422b214b35d4969211e82a15a3cb5c66981d94924f618bb78f34e156e85'; // hash of: mli2026
            // To change the password: open browser console, run:
            // crypto.subtle.digest('SHA-256', new TextEncoder().encode('YOUR_NEW_PASSWORD')).then(h => console.log([...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('')))
            // Then replace PASS_HASH above with the output.

            async function hashPassword(pw) {
                const data = new TextEncoder().encode(pw);
                const buf = await crypto.subtle.digest('SHA-256', data);
                return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
            }

            const gate = document.getElementById('auth-gate');
            const adminContent = document.getElementById('admin-content');
            const authInput = document.getElementById('auth-password');
            const authError = document.getElementById('auth-error');
            const authBtn = document.getElementById('auth-submit');

            // Check if already authenticated this session
            if (sessionStorage.getItem('mli_admin_auth') === 'true') {
                gate.style.display = 'none';
                adminContent.style.display = '';
            }

            authBtn.addEventListener('click', async () => {
                const hash = await hashPassword(authInput.value);
                if (hash === PASS_HASH) {
                    sessionStorage.setItem('mli_admin_auth', 'true');
                    gate.style.display = 'none';
                    adminContent.style.display = '';
                } else {
                    authError.style.display = 'block';
                    authInput.value = '';
                    authInput.focus();
                }
            });

            authInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') authBtn.click();
                authError.style.display = 'none';
            });

            // --- API Config ---
            const ADMIN_KEY = 'mli-admin-s3cret-2026-xyz'; // Must match Cloudflare env var ADMIN_KEY
            const API_BASE = '/api/bookings';

            function apiHeaders() {
                return {
                    'Content-Type': 'application/json',
                    'X-Admin-Key': ADMIN_KEY,
                };
            }

            // --- XSS Escape ---
            function esc(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            const monthNames = ['Januar', 'Februar', 'Marts', 'April', 'Maj', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'December'];
            const dayNames = ['Man', 'Tir', 'Ons', 'Tor', 'Fre', 'Lør', 'Søn'];

            let currentFilter = 'all';
            let calendarDate = new Date();
            let cachedBookings = []; // In-memory cache for render performance

            // --- API Functions ---
            async function fetchBookings() {
                try {
                    const res = await fetch(API_BASE, { headers: apiHeaders() });
                    if (!res.ok) throw new Error('API error');
                    cachedBookings = await res.json();
                } catch (err) {
                    console.error('Kunne ikke hente bookinger:', err);
                    cachedBookings = [];
                }
                return cachedBookings;
            }

            async function updateStatus(id, newStatus) {
                try {
                    await fetch(API_BASE + '/' + id, {
                        method: 'PUT',
                        headers: apiHeaders(),
                        body: JSON.stringify({ status: newStatus }),
                    });
                } catch (err) {
                    console.error('Kunne ikke opdatere status:', err);
                }
                await render();
            }

            async function deleteBooking(id) {
                try {
                    await fetch(API_BASE + '/' + id, {
                        method: 'DELETE',
                        headers: apiHeaders(),
                    });
                } catch (err) {
                    console.error('Kunne ikke slette booking:', err);
                }
                await render();
            }

            async function addBooking(bookingData) {
                try {
                    await fetch(API_BASE, {
                        method: 'POST',
                        headers: apiHeaders(),
                        body: JSON.stringify(bookingData),
                    });
                } catch (err) {
                    console.error('Kunne ikke tilføje booking:', err);
                }
                await render();
            }

            // --- Google Calendar URL ---
            function buildGoogleCalUrl(b) {
                const dc = b.date.replace(/-/g, '');
                const st = (b.timeStart || '18:00').replace(':', '') + '00';
                const et = (b.timeEnd || '21:00').replace(':', '') + '00';
                const title = encodeURIComponent('MLI Booking: ' + (b.eventType || 'Arrangement'));
                const loc = encodeURIComponent(b.location || '');
                const details = encodeURIComponent(
                    'Booking fra: ' + (b.name || '—') + '\n' +
                    'Email: ' + (b.email || '—') + '\n' +
                    (b.phone ? 'Tlf: ' + b.phone + '\n' : '') +
                    (b.organization ? 'Org: ' + b.organization + '\n' : '') +
                    'Type: ' + (b.eventType || '—') + '\n' +
                    (b.guests ? 'Gæster: ca. ' + b.guests + '\n' : '') +
                    (b.location ? 'Sted: ' + b.location + '\n' : '') +
                    (b.message ? 'Besked: ' + b.message : '')
                );
                return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + title +
                    '&dates=' + dc + 'T' + st + '/' + dc + 'T' + et +
                    '&details=' + details + '&location=' + loc + '&ctz=Europe/Copenhagen';
            }

            // --- Confirmation email to booker ---
            function buildConfirmationMailto(b) {
                const subject = encodeURIComponent('Din booking hos MLI er bekræftet — ' + b.date);
                const body = encodeURIComponent(
                    'Hej ' + (b.name || '') + ',\n\n' +
                    'Tak for din bookingforespørgsel! Jeg bekræfter hermed:\n\n' +
                    '📅 Dato: ' + b.date + '\n' +
                    '🕐 Tid: ' + (b.timeStart || '?') + ' — ' + (b.timeEnd || '?') + '\n' +
                    '📍 Sted: ' + (b.location || '—') + '\n' +
                    '🎵 Type: ' + (b.eventType || '—') + '\n\n' +
                    'Kontakt mig gerne hvis du har spørgsmål.\n\n' +
                    'Venlig hilsen,\nEmelie Blomgren (MLI)\ne.blomgren@outlook.dk'
                );
                return 'mailto:' + (b.email || '') + '?subject=' + subject + '&body=' + body;
            }

            // --- Stats ---
            function renderStats() {
                document.getElementById('stat-total').textContent = cachedBookings.length;
                document.getElementById('stat-pending').textContent = cachedBookings.filter(b => b.status === 'pending').length;
                document.getElementById('stat-approved').textContent = cachedBookings.filter(b => b.status === 'approved').length;
                document.getElementById('stat-declined').textContent = cachedBookings.filter(b => b.status === 'declined').length;
            }

            // --- Calendar ---
            function renderCalendar() {
                const grid = document.getElementById('calendar-grid');
                const year = calendarDate.getFullYear();
                const month = calendarDate.getMonth();
                document.getElementById('cal-month-label').textContent = monthNames[month] + ' ' + year;

                const bookings = cachedBookings;
                const byDate = {};
                bookings.forEach(b => { (byDate[b.date] = byDate[b.date] || []).push(b); });

                const firstDay = new Date(year, month, 1);
                let startDay = firstDay.getDay() - 1;
                if (startDay < 0) startDay = 6;
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const todayStr = new Date().toISOString().split('T')[0];

                let html = dayNames.map(d => '<div class="calendar-header-cell">' + d + '</div>').join('');
                for (let i = 0; i < startDay; i++) html += '<div class="calendar-day empty"></div>';

                for (let day = 1; day <= daysInMonth; day++) {
                    const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                    const db = byDate[ds] || [];
                    let cls = 'calendar-day';
                    if (ds === todayStr) cls += ' today';
                    let dot = '';
                    if (db.length) {
                        if (db.some(b => b.status === 'approved')) { cls += ' has-approved'; dot = '<div class="day-dot dot-approved"></div>'; }
                        else if (db.some(b => b.status === 'pending')) { cls += ' has-pending'; dot = '<div class="day-dot dot-pending"></div>'; }
                        else { cls += ' has-declined'; dot = '<div class="day-dot dot-declined"></div>'; }
                    }
                    const tip = db.length ? db.map(b => (b.timeStart || '?') + '–' + (b.timeEnd || '?') + ' ' + (b.eventType || '') + ' (' + b.status + ')').join(', ') : 'Ledig';
                    html += '<div class="' + cls + '" title="' + tip + '">' + day + dot + '</div>';
                }
                grid.innerHTML = html;
            }

            // --- Booking List ---
            function renderList() {
                const list = document.getElementById('booking-list');
                let bookings = [...cachedBookings];
                bookings.sort((a, b) => new Date(a.date) - new Date(b.date));
                if (currentFilter !== 'all') bookings = bookings.filter(b => b.status === currentFilter);

                if (!bookings.length) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Ingen bookinger at vise' +
                        (currentFilter !== 'all' ? ' med dette filter' : '') + '.</p></div>';
                    return;
                }

                list.innerHTML = bookings.map(b => {
                    const d = new Date(b.date + 'T00:00:00');
                    const dayNum = d.getDate();
                    const monthShort = monthNames[d.getMonth()].substring(0, 3).toUpperCase();
                    const timeStr = (b.timeStart && b.timeEnd) ? esc(b.timeStart) + ' — ' + esc(b.timeEnd) : '';
                    const callbackFlag = b.wantsCallback ? '<span class="callback-flag">📞 Ring op</span>' : '';

                    const statusLabel = b.status === 'pending' ? 'Afventer' : b.status === 'approved' ? 'Godkendt' : 'Afvist';
                    const statusBadge = '<span class="status-badge status-' + esc(b.status) + '">' + statusLabel + '</span>';

                    // Sanitize the ID for safe use in onclick
                    const safeId = esc(b.id);

                    let actions = '';
                    if (b.status === 'pending') {
                        actions += '<button class="action-btn action-approve" onclick="window._admin.approve(\'' + safeId + '\')">✓ Godkend</button>';
                        actions += '<button class="action-btn action-decline" onclick="window._admin.decline(\'' + safeId + '\')">✗ Afvis</button>';
                    } else if (b.status === 'approved') {
                        if (b.email) actions += '<a class="action-btn action-confirm" href="' + buildConfirmationMailto(b) + '">✉ Send bekræftelse</a>';
                        actions += '<a class="action-btn action-calendar" href="' + buildGoogleCalUrl(b) + '" target="_blank" rel="noopener">📅 Kalender</a>';
                        actions += '<button class="action-btn action-decline" onclick="window._admin.decline(\'' + safeId + '\')">✗ Afvis</button>';
                    } else {
                        actions += '<button class="action-btn action-approve" onclick="window._admin.approve(\'' + safeId + '\')">✓ Godkend</button>';
                    }
                    actions += '<button class="action-btn action-delete" onclick="window._admin.remove(\'' + safeId + '\')">🗑 Slet</button>';

                    return '<div class="booking-entry">' +
                        '<div class="booking-date-col">' +
                        '<div class="date-day">' + dayNum + '</div>' +
                        '<div class="date-month">' + monthShort + '</div>' +
                        (timeStr ? '<div class="date-time">' + timeStr + '</div>' : '') +
                        '</div>' +
                        '<div class="booking-info">' +
                        '<h4>' + esc(b.eventType || 'Booking') + ' ' + callbackFlag + ' ' + statusBadge + '</h4>' +
                        '<div class="booking-meta">' +
                        '<span>👤 ' + esc(b.name || '—') + (b.organization ? ' (' + esc(b.organization) + ')' : '') + '</span>' +
                        (b.email ? '<span>✉️ ' + esc(b.email) + '</span>' : '') +
                        (b.phone ? '<span>📞 ' + esc(b.phone) + '</span>' : '') +
                        '</div>' +
                        '<div class="booking-meta">' +
                        (b.location ? '<span>📍 ' + esc(b.location) + '</span>' : '') +
                        (b.guests ? '<span>👥 Ca. ' + b.guests + ' gæster</span>' : '') +
                        (timeStr ? '<span>🕐 ' + timeStr + '</span>' : '') +
                        '</div>' +
                        (b.message ? '<div class="booking-msg">"' + esc(b.message) + '"</div>' : '') +
                        '</div>' +
                        '<div class="booking-actions">' + actions + '</div>' +
                        '</div>';
                }).join('');
            }

            async function render() { await fetchBookings(); renderStats(); renderCalendar(); renderList(); }

            window._admin = {
                approve: function (id) { updateStatus(id, 'approved'); },
                decline: function (id) { updateStatus(id, 'declined'); },
                remove: function (id) { if (confirm('Slet denne booking?')) deleteBooking(id); }
            };

            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('.filter-tab').forEach(function (t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderList();
                });
            });

            // Calendar nav
            document.getElementById('cal-prev').addEventListener('click', function () { calendarDate.setMonth(calendarDate.getMonth() - 1); renderCalendar(); });
            document.getElementById('cal-next').addEventListener('click', function () { calendarDate.setMonth(calendarDate.getMonth() + 1); renderCalendar(); });

            // Add manual booking
            document.getElementById('add-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                var date = document.getElementById('add-date').value;
                if (!date) return;

                await addBooking({
                    name: document.getElementById('add-name').value.trim() || 'Manuel',
                    email: '',
                    phone: '',
                    wantsCallback: false,
                    date: date,
                    timeStart: document.getElementById('add-time-start').value || '18:00',
                    timeEnd: document.getElementById('add-time-end').value || '21:00',
                    eventType: document.getElementById('add-event').value.trim() || 'Blokeret',
                    location: document.getElementById('add-location').value.trim() || '',
                    guests: '',
                    organization: '',
                    message: document.getElementById('add-note').value.trim(),
                    status: document.getElementById('add-status').value,
                });
                e.target.reset();
            });

            // Nav scroll
            var nav = document.querySelector('.nav');
            if (nav) window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 50); });

            render();
        })();
    </script>
</body>

</html>
