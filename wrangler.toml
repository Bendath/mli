# Cloudflare Pages config for MLI website
# KV namespace must be created in Cloudflare dashboard and bound below

name = "mli-website"
compatibility_date = "2024-01-01"

# KV namespace binding — replace the 'id' after creating the namespace
# in Cloudflare Dashboard > Workers & Pages > KV
[[kv_namespaces]]
binding = "MLI_BOOKINGS"
id = "b0a2ae58382e4957b280cd58a3545154"
